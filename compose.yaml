name: video-audio-bot
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-video_audio_bot}
      POSTGRES_USER: ${DB_USER:-video_audio_bot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  telegram-bot-api:
    image: ${LOCAL_BOT_IMAGE:-local-server-telegram-bot:local}
    build:
      context: ${LOCAL_BOT_CONTEXT:-../local-server-telegram-bot}
      args:
        TELEGRAM_BOT_API_REF: ${TELEGRAM_BOT_API_REF:-e3e9dd8e5b3d7ab8537cd5a10dc31d5ffa8f82d1}
        BUILD_JOBS: ${LOCAL_BOT_BUILD_JOBS:-2}
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH}
      TELEGRAM_HTTP_PORT: "8081"
      TELEGRAM_DATA_DIR: /var/lib/telegram-bot-api
      TELEGRAM_TEMP_DIR: /var/lib/telegram-bot-api/temp
      TELEGRAM_VERBOSITY: ${TELEGRAM_VERBOSITY:-1}
    volumes:
      - telegram_data:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --max-time 3 -o /dev/null http://127.0.0.1:8081/"]
      interval: 10s
      timeout: 5s
      retries: 30
    stop_grace_period: 1m
  app:
    build: .
    image: ${APP_IMAGE:-video-audio-bot:local}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-video_audio_bot}
      TELEGRAM_BASE_URL: http://telegram-bot-api:8081
      TELEGRAM_LOCAL_DIRECTORY: /var/lib/telegram-bot-api
      TELEGRAM_SERVER_DIRECTORY: /var/lib/telegram-bot-api
      WORK_DIRECTORY: /app/work
    volumes:
      - telegram_data:/var/lib/telegram-bot-api
      - work_data:/app/work
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      telegram-bot-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    stop_grace_period: ${APP_STOP_GRACE_PERIOD:-45s}
volumes:
  postgres_data:
  telegram_data:
  work_data:
